<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngajol - Ojek Online Urang Sunda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { width: 100%; max-width: 380px; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo-icon { width: 60px; height: 60px; background: #16a34a; color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px auto; }
        .logo h2 { font-size: 20px; color: #0f172a; margin-top: 5px; font-weight: bold; }
        .logo p { font-size: 12px; color: #64748b; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 11px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #16a34a; }
        
        .btn { width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #15803d; }
        
        .toggle-btn { text-align: center; margin-top: 15px; font-size: 12px; color: #64748b; }
        .toggle-btn span { color: #16a34a; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">
            <img src="/ngajol-logo.png" alt="Logo NGAJOL"
                 style="width:100px;height:100px;object-fit:contain;border-radius:18px;margin-bottom:10px;">
            <h2>NGAJOL</h2>
            <p>Ojek Online Urang Sunda</p>
        </div>

        <!-- Form Login Tunggal -->
        <div id="loginForm">
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> Nomor HP</label>
                <input type="number" id="loginHp" placeholder="Masukkan No HP">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="loginPass" placeholder="Masukkan password">
            </div>
            <button class="btn" onclick="doLogin()"><i class="fa-solid fa-right-to-bracket"></i> MASUK APLIKASI</button>
            <div class="toggle-btn">
                <span onclick="showForgotPassword()">Lupa Password?</span>
            </div>
            <div class="toggle-btn">
                Belum punya akun? <span onclick="toggleAuth(true)">Daftar Akun Baru</span>
            </div>
        </div>

        <!-- FORM LUPA PASSWORD -->
        <div id="forgotForm" class="hidden">
            <div class="form-group">
                <label>Nomor HP Terdaftar</label>
                <input type="number" id="forgotHp" placeholder="Masukkan nomor HP">
            </div>
            <button class="btn" onclick="loadSecurityQuestion()">CARI PERTANYAAN</button>
            <div id="forgotAnswerSection" class="hidden">
                <p id="forgotQuestion"></p>
                <div class="form-group">
                    <label>Jawaban Keamanan</label>
                    <input type="text" id="forgotAnswer">
                </div>
                <div class="form-group">
                    <label>Password Baru</label>
                    <input type="password" id="forgotNewPassword">
                </div>
                <div class="form-group">
                    <label>Ulangi Password Baru</label>
                    <input type="password" id="forgotConfirmPassword">
                </div>
                <button class="btn" onclick="resetPassword()">UBAH PASSWORD</button>
            </div>
            <div class="toggle-btn">
                <span onclick="backToLogin()">Kembali ke Login</span>
            </div>
        </div>

        <!-- Form Register (Pilih Role di Sini) -->
        <div id="regForm" class="hidden">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Nama Lengkap</label>
                <input type="text" id="regNama" placeholder="Nama lengkap kamu">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> Nomor HP</label>
                <input type="number" id="regHp" placeholder="Contoh: 08123456789">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="regPass" placeholder="Buat password">
            </div>
            <div class="form-group">
                <div class="form-group">
                <label>Pertanyaan Keamanan</label>
                <input type="text" id="regSecurityQuestion" placeholder="Contoh: Siapa teman sekolah Anda?">
            </div>
            <div class="form-group">
                <label>Jawaban Keamanan</label>
                <input type="text" id="regSecurityAnswer" placeholder="Masukkan jawaban yang mudah diingat">
            </div>
            <label><i class="fa-solid fa-id-badge"></i> Daftar Sebagai</label>
                <select id="regRole">
                    <option value="penumpang">Penumpang</option>
                    <option value="driver">Driver (Mitra Ojek)</option>
                </select>
            </div>
            <button class="btn" onclick="doRegister()"><i class="fa-solid fa-user-plus"></i> DAFTAR SEKARANG</button>
            <div class="toggle-btn">
                Sudah punya akun? <span onclick="toggleAuth(false)">Masuk di sini</span>
            </div>
        </div>
    </div>

    <script>
        // Cek Sesi Otomatis Saat Buka Aplikasi
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('ngajol_token');
            if (!token) return;

            try {
                const res = await fetch('/api/me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();

                if (res.ok && data.success && data.user) {
                    localStorage.setItem('ngajol_user', JSON.stringify(data.user));
                    redirectByRole(data.user.role);
                } else {
                    localStorage.removeItem('ngajol_token');
                    localStorage.removeItem('ngajol_user');
                }
            } catch (e) {
                console.error('Pemeriksaan sesi gagal:', e);
            }
        });


        function toggleAuth(showReg) {
            document.getElementById('loginForm').classList.toggle('hidden', showReg);
            document.getElementById('regForm').classList.toggle('hidden', !showReg);
            document.getElementById('forgotForm').classList.add('hidden');
        }

        function showForgotPassword() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('regForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.remove('hidden');
            document.getElementById('forgotAnswerSection').classList.add('hidden');
        }

        function backToLogin() {
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('regForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('forgotAnswerSection').classList.add('hidden');
        }

        function redirectByRole(role) {
            window.location.href = role === 'driver' ? '/driver.html' : '/passenger.html';
        }

        async function loadSecurityQuestion() {
            const no_hp = document.getElementById('forgotHp').value.trim();
            if (!no_hp) return alert('Masukkan nomor HP terlebih dahulu.');

            try {
                const res = await fetch('/api/forgot-password/question', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({no_hp})
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    document.getElementById('forgotAnswerSection').classList.add('hidden');
                    return alert(data.message || 'Pertanyaan keamanan tidak ditemukan.');
                }

                document.getElementById('forgotQuestion').textContent = data.security_question;
                document.getElementById('forgotAnswer').value = '';
                document.getElementById('forgotNewPassword').value = '';
                document.getElementById('forgotConfirmPassword').value = '';
                document.getElementById('forgotAnswerSection').classList.remove('hidden');
            } catch (e) {
                alert('Gagal terhubung ke server.');
            }
        }

        async function resetPassword() {
            const no_hp = document.getElementById('forgotHp').value.trim();
            const security_answer = document.getElementById('forgotAnswer').value.trim();
            const new_password = document.getElementById('forgotNewPassword').value;
            const confirm = document.getElementById('forgotConfirmPassword').value;

            if (!security_answer || !new_password || !confirm)
                return alert('Lengkapi semua kolom.');
            if (new_password.length < 8 || new TextEncoder().encode(new_password).length > 72)
                return alert('Password harus 8–72 byte.');
            if (new_password !== confirm)
                return alert('Konfirmasi password tidak sama.');

            try {
                const res = await fetch('/api/forgot-password/reset', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({no_hp, security_answer, new_password})
                });
                const data = await res.json();

                if (!res.ok || !data.success)
                    return alert(data.message || 'Reset password gagal.');

                alert('Password berhasil diubah. Silakan login.');
                document.getElementById('loginHp').value = no_hp;
                document.getElementById('loginPass').value = '';
                backToLogin();
            } catch (e) {
                alert('Gagal terhubung ke server.');
            }
        }

        async function doLogin() {
            const no_hp = document.getElementById('loginHp').value.trim();
            const password = document.getElementById('loginPass').value;
            if (!no_hp || !password) return alert('Isi Nomor HP dan password.');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({no_hp, password})
                });
                const data = await res.json();

                if (!res.ok || !data.success)
                    return alert(data.message || 'Login gagal.');

                if (!data.user.hasSecurityQuestion) {
                    const security_question = prompt('Akun lama belum memiliki pertanyaan keamanan. Buat pertanyaan (minimal 5 karakter):');
                    if (!security_question) return alert('Pengaturan keamanan dibatalkan.');

                    const security_answer = prompt('Masukkan jawaban keamanan (minimal 2 karakter):');
                    if (!security_answer) return alert('Jawaban keamanan wajib diisi.');

                    const setupRes = await fetch('/api/security-question', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${data.token}`
                        },
                        body: JSON.stringify({security_question, security_answer})
                    });
                    const setupData = await setupRes.json();

                    if (!setupRes.ok || !setupData.success)
                        return alert(setupData.message || 'Gagal menyimpan pertanyaan keamanan.');

                    data.user.hasSecurityQuestion = true;
                }

                alert(`Login berhasil! Selamat datang, ${data.user.nama}`);
                localStorage.setItem('ngajol_token', data.token);
                localStorage.setItem('ngajol_user', JSON.stringify(data.user));
                redirectByRole(data.user.role);
            } catch (e) {
                console.error(e);
                alert('Gagal terhubung ke server.');
            }
        }

        async function doRegister() {
            const nama = document.getElementById('regNama').value.trim();
            const no_hp = document.getElementById('regHp').value.trim();
            const password = document.getElementById('regPass').value;
            const security_question = document.getElementById('regSecurityQuestion').value.trim();
            const security_answer = document.getElementById('regSecurityAnswer').value.trim();
            const role = document.getElementById('regRole').value;

            if (!nama || !no_hp || !password || !security_question || !security_answer)
                return alert('Lengkapi semua data pendaftaran.');
            if (password.length < 8 || new TextEncoder().encode(password).length > 72)
                return alert('Password harus 8–72 byte.');
            if (security_question.length < 5 || security_question.length > 200)
                return alert('Pertanyaan keamanan harus 5–200 karakter.');
            if (new TextEncoder().encode(security_answer).length < 2 ||
                new TextEncoder().encode(security_answer).length > 72)
                return alert('Jawaban keamanan harus 2–72 byte.');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        nama, no_hp, password, role,
                        security_question, security_answer
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    alert('Pendaftaran berhasil! Silakan login.');
                    toggleAuth(false);
                    document.getElementById('loginHp').value = no_hp;
                } else {
                    alert(data.message || 'Pendaftaran gagal.');
                }
            } catch (e) {
                alert('Gagal mendaftar ke server.');
            }
        }

    </script>
</body>
</html>
